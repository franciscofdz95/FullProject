<div class="aput-files-dialog">
  <div class="aput-files-header">
    <div class="aput-files-title">FTP Folder &amp; Files</div>
    <button type="button" class="btn-close-icon" title="Close" (click)="close()">
      <i class="fas fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="aput-files-body">
    <div class="folder-row">
      <label for="sftpFolder">APUT FTP Root Directory</label>
      <select id="sftpFolder" class="form-select" [(ngModel)]="selectedFolder" (change)="onFolderChange()" [disabled]="isLoadingFolders">
        <option *ngFor="let folder of folders" [value]="folder.name">{{ folder.name }}</option>
      </select>
      <button type="button" class="btn btn-outline-secondary btn-sm refresh-btn" title="Refresh" (click)="refresh()">
        <i class="fas fa-solid fa-arrows-rotate"></i> Refresh
      </button>
    </div>

    <div class="grid-wrapper">
      <ag-grid-angular
        style="width: 100%; height: 100%;"
        class="ag-theme-balham"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="pageSize"
        [suppressPaginationPanel]="true"
        [rowModelType]="'infinite'"
        [cacheBlockSize]="pageSize"
        [overlayLoadingTemplate]="overlayLoadingTemplate"
        overlayNoRowsTemplate="<span>No files found for this folder</span>"
        (gridReady)="onGridReady($event)"
        (paginationChanged)="onPaginationChanged()">
      </ag-grid-angular>
    </div>

    <div class="pagination-bar">
      <div class="pagination-summary">
        Displaying {{ displayFrom }} - {{ displayTo }} of {{ totalRows }}
      </div>
      <div class="pagination-controls">
        <button type="button" class="btn btn-sm btn-outline-secondary" title="First Page" [disabled]="currentPage <= 1" (click)="goToFirstPage()">
          <i class="fas fa-solid fa-angles-left"></i>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" title="Previous Page" [disabled]="currentPage <= 1" (click)="goToPreviousPage()">
          <i class="fas fa-solid fa-angle-left"></i>
        </button>
        <span class="page-input-wrapper">
          Page
          <input type="number" class="page-input" [(ngModel)]="pageInput" (change)="goToPage()" min="1" [max]="totalPages" />
          of {{ totalPages }}
        </span>
        <button type="button" class="btn btn-sm btn-outline-secondary" title="Next Page" [disabled]="currentPage >= totalPages" (click)="goToNextPage()">
          <i class="fas fa-solid fa-angle-right"></i>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" title="Last Page" [disabled]="currentPage >= totalPages" (click)="goToLastPage()">
          <i class="fas fa-solid fa-angles-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>
